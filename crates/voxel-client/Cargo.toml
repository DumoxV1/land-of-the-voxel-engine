[package]
name = "voxel-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Tracy real-time frame profiler. OFF by default: enabling broadcasts discovery packets
# on the local network and pulls in the C++ Tracy client. Only enable for profiling runs.
# Forwards to voxel-gpu so the worker-pool Gen/Mesh phases are also instrumented.
tracy = ["dep:tracy-client", "voxel-gpu/tracy"]

[dependencies]
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.27"
image = "0.25"
env_logger = "0.11"
log = "0.4"
futures = "0.3"
anyhow = "1"
winit = "0.30"
crossbeam-channel = "0.5"
num_cpus = "1"
voxel-core = { path = "../voxel-core" }
voxel-mesher = { path = "../voxel-mesher" }
voxel-world = { path = "../voxel-world" }
voxel-worldgen = { path = "../voxel-worldgen" }
voxel-player = { path = "../voxel-player" }
voxel-gpu = { path = "../voxel-gpu" }
voxel-edit = { path = "../voxel-edit" }
# Tracy v0.13.1 client (tracy-client-sys 0.28.0). Pinned to match the profiler GUI the user
# downloads. `enable` turns on the actual instrumentation; behind the `tracy` feature so the
# default build stays Tracy-free (no C++ TU compile, no LAN broadcast).
tracy-client = { version = "0.18", features = ["enable"], optional = true }

[dev-dependencies]
voxel-worldgen = { path = "../voxel-worldgen" }
futures = "0.3"
