[package]
name = "voxel-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Tracy real-time frame profiler. OFF by default (no LAN broadcast, no C++ client dep).
# The client forwards this feature when built with `--features tracy`.
tracy = ["dep:tracy-client"]

[dependencies]
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.27"
image = "0.25"
env_logger = "0.11"
log = "0.4"
futures = "0.3"
anyhow = "1"
winit = "0.30"
crossbeam-channel = "0.5"
num_cpus = "1"
tracy-client = { version = "0.18", features = ["enable"], optional = true }
voxel-core = { path = "../voxel-core" }
voxel-mesher = { path = "../voxel-mesher" }
voxel-world = { path = "../voxel-world" }
voxel-worldgen = { path = "../voxel-worldgen" }
voxel-player = { path = "../voxel-player" }

[dev-dependencies]
voxel-worldgen = { path = "../voxel-worldgen" }
futures = "0.3"
